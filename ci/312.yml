name: test
channels:
  - conda-forge
dependencies:
  - python ==3.12
  - pip
  - setuptools_scm

  - scipy
  - numpy
  - nanobind
  - cmake
  - scikit-build-core
  - cxx-compiler
  - polyagamma
  - pip:
    - jax >=0.9.0 # force jax from pip so windows has an installer
  # testing
  - pytest
  - pytest-cov
  - pytest-reportlog
  - pytest-timeout
  - pytest-xdist
  - codecov
  - coverage
