name: augax-docs
channels:
  - conda-forge
dependencies:
  - python>=3.13
  - setuptools_scm

  - pip
  - numpy
  - jax

  # build augax from source (pip install -e .)
  - nanobind
  - cmake
  - scikit-build-core
  - cxx-compiler

  # docs
  - myst-parser
  - sphinx>=7
  - sphinxcontrib-bibtex
  - sphinx-copybutton
  - furo
  - watermark